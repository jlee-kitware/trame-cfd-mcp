<text x="104" y="173" text-anchor="middle" font-size="10" fill="#94A3B8" font-family="Helvetica Neue,Arial,sans-serif">web server</text>

<!-- LLM -->
<rect x="196" y="134" width="140" height="50" rx="6" fill="#142740" stroke="#0D9488" stroke-width="1.5"/>
<text x="266" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Helvetica Neue,Arial,sans-serif">LLM</text>
<text x="266" y="173" text-anchor="middle" font-size="10" fill="#94A3B8" font-family="Helvetica Neue,Arial,sans-serif">intent · explain</text>

