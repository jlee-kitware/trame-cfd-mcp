<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect width="900" height="510" fill="#0F1B2D"/>

<!-- ── BROWSER ────────────────────────────────────────── -->
<rect x="330" y="16" width="240" height="52" rx="8" fill="#1E3A5F" stroke="#0D9488" stroke-width="1.5"/>
<text x="450" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF" font-family="Helvetica Neue,Arial,sans-serif">Browser</text>
<text x="450" y="55" text-anchor="middle" font-size="10" fill="#94A3B8" font-family="Helvetica Neue,Arial,sans-serif">thin client · receives rendered frames only</text>

<line x1="408" y1="68" x2="408" y2="106" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="402" y="92" text-anchor="end" font-size="10" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif">input</text>
<line x1="492" y1="106" x2="492" y2="68" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="498" y="92" text-anchor="start" font-size="10" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif">frames</text>

