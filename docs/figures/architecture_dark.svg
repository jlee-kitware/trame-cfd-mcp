<rect x="28" y="106" width="844" height="196" rx="12" fill="none" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450" y="124" text-anchor="middle" font-size="10" font-style="italic" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif">Orchestration layer</text>

