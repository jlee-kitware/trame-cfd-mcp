[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paraview-llm"
version = "0.1.0"
description = "CFD ontology-based orchestrator for ParaView LLM integration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Jeff Lee", email = "jlee1549@gmail.com" }
]
keywords = ["paraview", "cfd", "llm", "ontology", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

# No required LLM dependency - user chooses
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.18.0"]
all = ["openai>=1.0", "anthropic>=0.18.0"]
dev = [
    "openai>=1.0",
    "anthropic>=0.18.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/Kitware/paraview-llm"
Repository = "https://github.com/Kitware/paraview-llm"

[tool.hatch.build.targets.wheel]
packages = ["src/paraview_llm"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
