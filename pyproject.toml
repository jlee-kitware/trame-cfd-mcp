[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paraview-llm"
version = "0.1.0"
description = "Natural language interface for CFD post-processing with ParaView"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Kitware, Inc." }
]
keywords = ["paraview", "cfd", "llm", "visualization", "scientific-computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy",
    "python-dotenv",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = [
    "openai>=1.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/Kitware/paraview-llm"
Repository = "https://github.com/Kitware/paraview-llm"

[tool.hatch.build.targets.wheel]
packages = ["src/paraview_llm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
